name: Feature request
description: Suggest a capability or an improvement
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        This project is deliberately small. The best proposals explain a real problem rather
        than a solution looking for one.

        Requests that make the bot better at spam, bulk messaging, scraping, or evading
        WhatsApp's anti-automation measures will be closed — see
        [DISCLAIMER.md](https://github.com/ndanilo/wa-groupmind/blob/master/DISCLAIMER.md).

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: Describe the situation, not the feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including whether existing configuration already gets you close.

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and discussions for this idea
          required: true
        - label: This request does not involve spam, bulk messaging, scraping or surveillance
          required: true
